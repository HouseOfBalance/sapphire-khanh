name: Build iOS 16 RootFS (Userdata Sparse Image)

on:
  workflow_dispatch:

jobs:
  build-root:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install blacktop/tap/ipsw android-platform-tools
          sw_vers

      - name: Extract DMGs via HTTP Range (remotezip)
        run: |
          URL="https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
          mkdir -p dmgs
          echo "Fetching OS DMG (087-86698-044.dmg)..."
          python3 tools/remotezip.py "$URL" 087-86698-044.dmg dmgs
          echo "Fetching SystemOS Cryptex DMG (087-86593-047.dmg)..."
          python3 tools/remotezip.py "$URL" 087-86593-047.dmg dmgs
          echo "Fetching AppOS Cryptex DMG (087-86715-047.dmg)..."
          python3 tools/remotezip.py "$URL" 087-86715-047.dmg dmgs
          ls -lh dmgs/

      - name: Assemble HFS+ iOS 16 Root Image
        run: |
          mkdir -p out
          OS_DMG="dmgs/087-86698-044.dmg"
          SYS_DMG="dmgs/087-86593-047.dmg"
          APP_DMG="dmgs/087-86715-047.dmg"
          ROOT_IMG="out/ios16-root.img"

          echo "Creating empty 16GB image..."
          rm -f "$ROOT_IMG"
          hdiutil create -size 16g -fs "Case-sensitive Journaled HFS+" -volname iOSRoot -layout NONE "$ROOT_IMG"

          echo "Attaching images..."
          MNT_ROOT=$(hdiutil attach "$ROOT_IMG" -nobrowse -mountrandom /tmp | awk '{print $3}')
          MNT_OS=$(hdiutil attach "$OS_DMG" -nobrowse -mountrandom /tmp -readonly | awk '{print $3}')
          MNT_SYS=$(hdiutil attach "$SYS_DMG" -nobrowse -mountrandom /tmp -readonly | awk '{print $3}')
          MNT_APP=$(hdiutil attach "$APP_DMG" -nobrowse -mountrandom /tmp -readonly | awk '{print $3}')

          echo "Root mounted at: $MNT_ROOT"
          echo "OS mounted at: $MNT_OS"
          echo "SystemOS mounted at: $MNT_SYS"
          echo "AppOS mounted at: $MNT_APP"

          echo "Copying OS root..."
          sudo cp -a "$MNT_OS/." "$MNT_ROOT/"

          echo "Copying Cryptexes..."
          sudo mkdir -p "$MNT_ROOT/private/preboot/Cryptexes/OS" "$MNT_ROOT/private/preboot/Cryptexes/App"
          sudo cp -a "$MNT_SYS/." "$MNT_ROOT/private/preboot/Cryptexes/OS/"
          sudo cp -a "$MNT_APP/." "$MNT_ROOT/private/preboot/Cryptexes/App/"

          echo "Hardlinking Dyld Shared Cache for ignition level 1..."
          DSC="private/preboot/Cryptexes/OS/System/Library/Caches/com.apple.dyld"
          sudo mkdir -p "$MNT_ROOT/System/Library/Caches/com.apple.dyld"
          for f in "$MNT_ROOT/$DSC"/*; do
            sudo ln -f "$f" "$MNT_ROOT/System/Library/Caches/com.apple.dyld/$(basename "$f")" || sudo cp -p "$f" "$MNT_ROOT/System/Library/Caches/com.apple.dyld/"
          done

          echo "Hardlinking cryptex files without root counterparts..."
          for c in OS App; do
            (cd "$MNT_ROOT/private/preboot/Cryptexes/$c" && sudo find . ! -type d ! -path './System/Library/Caches/com.apple.dyld/*') |
            while IFS= read -r f; do
              f=${f#./}
              if ! sudo test -e "$MNT_ROOT/$f" && ! sudo test -L "$MNT_ROOT/$f"; then
                sudo mkdir -p "$MNT_ROOT/$(dirname "$f")"
                src="$MNT_ROOT/private/preboot/Cryptexes/$c/$f"
                if sudo test -L "$src"; then
                  sudo cp -P "$src" "$MNT_ROOT/$f"
                else
                  sudo ln "$src" "$MNT_ROOT/$f" 2>/dev/null || sudo cp -p "$src" "$MNT_ROOT/$f"
                fi
              fi
            done
          done

          echo "Setting up diagnostic directories and migration flags..."
          DB="$MNT_ROOT/private/var/db"
          sudo mkdir -p "$DB/diagnostics/timesync" "$DB/uuidtext"
          sudo chown -R 272:272 "$DB/diagnostics" "$DB/uuidtext" 2>/dev/null || true
          sudo chmod 0751 "$DB/diagnostics"
          sudo chmod 0755 "$DB/uuidtext" "$DB/diagnostics/timesync"
          for d in diagnostics uuidtext diagnostics/timesync; do
            sudo touch "$DB/$d/.migrated"
            sudo chown 272:272 "$DB/$d/.migrated" 2>/dev/null || true
            sudo chmod 0644 "$DB/$d/.migrated"
          done

          echo "Creating default system keybag..."
          sudo mkdir -p "$MNT_ROOT/private/var/keybags"
          sudo chmod 0700 "$MNT_ROOT/private/var/keybags"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>KeyBagKeys</key><data>U1dFRVQ=</data></dict></plist>' |
            sudo tee "$MNT_ROOT/private/var/keybags/systembag.kb" >/dev/null
          sudo chmod 0600 "$MNT_ROOT/private/var/keybags/systembag.kb"

          echo "Applying sweet-root-tweaks (SpringBoard, Setup, launchd patch)..."
          sudo python3 tools/sweet-root-tweaks.py "$MNT_ROOT"

          echo "Detaching mounts..."
          sync
          hdiutil detach "$MNT_OS" -force || true
          hdiutil detach "$MNT_SYS" -force || true
          hdiutil detach "$MNT_APP" -force || true
          hdiutil detach "$MNT_ROOT" -force || true

      - name: Convert to Android Sparse Image (img2simg)
        run: |
          RAW_IMG="out/ios16-root.img"
          SIMG="out/userdata.simg"
          echo "Converting raw HFS+ image to userdata.simg..."
          img2simg "$RAW_IMG" "$SIMG"
          ls -lh "$SIMG"
          rm -f "$RAW_IMG"

          echo "Splitting sparse image into parts for upload..."
          mkdir -p out/parts
          split -b 1900M "$SIMG" out/parts/userdata.simg.part_
          echo "To join on Windows: copy /b userdata.simg.part_* userdata.simg" > out/parts/HOW_TO_JOIN.txt
          echo "Then flash in fastboot: fastboot flash userdata userdata.simg" >> out/parts/HOW_TO_JOIN.txt
          ls -lh out/parts/

      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios16-userdata-rootfs
          path: out/parts/
          if-no-files-found: error
