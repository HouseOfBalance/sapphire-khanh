name: Build iOS 16 RootFS (Userdata Sparse Image)

on:
  workflow_dispatch:

jobs:
  build-root:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install android-platform-tools
          sw_vers

      - name: Extract DMGs via HTTP Range (remotezip)
        run: |
          URL="https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
          mkdir -p dmgs
          echo "Fetching OS DMG (087-86698-044.dmg)..."
          python3 tools/remotezip.py "$URL" 087-86698-044.dmg dmgs
          echo "Fetching SystemOS Cryptex DMG (087-86593-047.dmg)..."
          python3 tools/remotezip.py "$URL" 087-86593-047.dmg dmgs
          echo "Fetching AppOS Cryptex DMG (087-86715-047.dmg)..."
          python3 tools/remotezip.py "$URL" 087-86715-047.dmg dmgs
          ls -lh dmgs/

      - name: Assemble HFS+ iOS 16 Root Image via Python Builder
        run: |
          chmod +x tools/*.py
          python3 tools/build_rootfs_macos.py 2>&1 | tee build_log.txt
          ls -la out/ || true

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: ignore

      - name: Prepare Artifact Parts
        run: |
          echo "Finding generated simg or img in out/..."
          ls -la out/
          
          # Find either userdata.simg or any generated .simg / .img
          SIMG=""
          if [ -f "out/userdata.simg" ]; then
            SIMG="out/userdata.simg"
          else
            SIMG=$(find out -type f \( -name "*.simg" -o -name "*.img" \) | head -n 1)
          fi
          
          if [ -z "$SIMG" ] || [ ! -f "$SIMG" ]; then
            echo "ERROR: No root image file found in out/!"
            exit 1
          fi
          
          echo "Using image: $SIMG ($(ls -lh "$SIMG" | awk '{print $5}'))"
          mkdir -p out/parts
          split -b 1900M "$SIMG" out/parts/userdata.simg.part_
          echo "To join on Windows: copy /b userdata.simg.part_* userdata.simg" > out/parts/HOW_TO_JOIN.txt
          echo "Then flash in fastboot: fastboot flash userdata userdata.simg" >> out/parts/HOW_TO_JOIN.txt
          ls -lh out/parts/

      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios16-userdata-rootfs
          path: out/parts/
          if-no-files-found: error
